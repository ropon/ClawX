[package]
name = "clawx"
version = "1.0.0"
description = "ClawX - Multi-Agent Desktop AI Assistant"
authors = ["ValueCell-ai"]
edition = "2021"

[lib]
name = "clawx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
dirs = "5"
byteorder = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
walkdir = "2"

# Device authentication (Ed25519)
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"

# Week 7: Document parsing
lopdf = "0.33"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

# Week 7: Web scraping
scraper = "0.20"

# Week 7: File watching + Cron scheduling
notify = { version = "6", features = ["macos_fsevent"] }
cron = "0.12"
regex = "1"

# OpenClaw runtime extraction (tar.gz on first launch)
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
