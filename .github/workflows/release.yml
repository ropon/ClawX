# ClawX Release Workflow — Tauri 2
# Builds and publishes releases for macOS, Windows, and Linux

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # Job: Build Tauri app for each platform
  # ──────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - os: macos-latest
            platform: mac-x64
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - os: windows-latest
            platform: win
            args: ''
            target: ''
          - os: ubuntu-22.04
            platform: linux
            args: ''
            target: ''

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: $(pnpm store path --silent 2>/dev/null || echo ~/.pnpm-store)
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing
          APPLE_CERTIFICATE: ${{ secrets.MAC_CERTS }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          # Don't create GitHub release here — we do it in the publish job
          tagName: ''
          releaseName: ''
          releaseBody: ''
          releaseDraft: false
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.msi.zip
            src-tauri/target/**/release/bundle/**/*.msi.zip.sig
            src-tauri/target/**/release/bundle/**/*.nsis.zip
            src-tauri/target/**/release/bundle/**/*.nsis.zip.sig
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz
            src-tauri/target/**/release/bundle/**/*.AppImage.tar.gz.sig
            src-tauri/target/**/release/bundle/**/*.deb
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # Job: Publish to GitHub Releases + Generate update manifest
  # ──────────────────────────────────────────────────────────────
  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List all downloaded artifacts
        run: |
          echo "=== All artifacts ==="
          find release-artifacts/ -type f | head -50
          echo ""
          find release-artifacts/ -type f | wc -l
          echo "files total"

      - name: Extract version and channel
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Detected version: ${VERSION}, channel: ${CHANNEL}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
          make_latest: ${{ !(contains(github.ref, 'alpha') || contains(github.ref, 'beta')) }}
          generate_release_notes: true
          body: |
            ## ClawX ${{ github.ref_name }}

            ClawX - Multi-Agent Desktop AI Assistant based on OpenClaw

            ### Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | macOS | Apple Silicon | `*.aarch64.dmg` |
            | macOS | Intel | `*.x64.dmg` |
            | Windows | x64 | `*.msi` or `*.exe` |
            | Linux | x64 | `*.AppImage` or `*.deb` |

            ### Notes

            - **macOS**: On first launch, go to System Preferences → Security & Privacy to allow
            - **Windows**: SmartScreen may block — click "More info" → "Run anyway"
            - **Linux AppImage**: `chmod +x ClawX-*.AppImage`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────
  # Job: Upload to Alibaba Cloud OSS
  # ──────────────────────────────────────────────────────────────
  upload-oss:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Extract version and channel
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi

          if [[ "$VERSION" =~ -([a-zA-Z]+) ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT

      - name: Prepare upload directories
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          mkdir -p staging/${CHANNEL}
          mkdir -p staging/releases/${TAG}

          # Flatten all platform artifacts into staging directories
          find release-artifacts/ -type f | while read file; do
            filename=$(basename "$file")
            cp "$file" "staging/${CHANNEL}/${filename}"
            cp "$file" "staging/releases/${TAG}/${filename}"
          done

          echo "=== staging/${CHANNEL}/ ==="
          ls -lh staging/${CHANNEL}/

      - name: Generate release-info.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          BASE_URL="https://oss.intelli-spectrum.com/${CHANNEL}"

          jq -n \
            --arg version "$VERSION" \
            --arg channel "$CHANNEL" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$BASE_URL" \
            --arg changelog "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            '{
              version: $version,
              channel: $channel,
              releaseDate: $date,
              downloads: {
                mac: {
                  arm64: ($base + "/ClawX_" + $version + "_aarch64.dmg"),
                  x64: ($base + "/ClawX_" + $version + "_x64.dmg")
                },
                win: {
                  x64: ($base + "/ClawX_" + $version + "_x64-setup.exe")
                },
                linux: {
                  appimage: ($base + "/ClawX_" + $version + "_amd64.AppImage"),
                  deb: ($base + "/ClawX_" + $version + "_amd64.deb")
                }
              },
              changelog: $changelog
            }' > staging/${CHANNEL}/release-info.json

          echo "=== release-info.json ==="
          cat staging/${CHANNEL}/release-info.json

      - name: Generate tauri-update.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          BASE_URL="https://oss.intelli-spectrum.com/${CHANNEL}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Read .sig files for each platform (generated by tauri-action)
          read_sig() {
            local pattern="$1"
            local sig_file=$(find staging/${CHANNEL}/ -name "${pattern}" -print -quit 2>/dev/null)
            if [ -n "$sig_file" ] && [ -f "$sig_file" ]; then
              cat "$sig_file"
            else
              echo ""
            fi
          }

          MAC_ARM64_SIG=$(read_sig "*.app.tar.gz.sig" | head -1)
          MAC_X64_SIG=$(read_sig "*x64*.app.tar.gz.sig" | head -1)
          WIN_SIG=$(read_sig "*.nsis.zip.sig" | head -1)
          LINUX_SIG=$(read_sig "*.AppImage.tar.gz.sig" | head -1)

          # Find actual archive filenames
          find_file() {
            local pattern="$1"
            find staging/${CHANNEL}/ -name "${pattern}" -printf '%f\n' -quit 2>/dev/null || \
            find staging/${CHANNEL}/ -name "${pattern}" -print -quit 2>/dev/null | xargs -I{} basename {} 2>/dev/null || \
            echo ""
          }

          # Build Tauri 2 updater manifest
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            --arg pub_date "$PUB_DATE" \
            --arg base "$BASE_URL" \
            --arg mac_arm64_sig "$MAC_ARM64_SIG" \
            --arg mac_x64_sig "$MAC_X64_SIG" \
            --arg win_sig "$WIN_SIG" \
            --arg linux_sig "$LINUX_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": {
                  url: ($base + "/ClawX.app.tar.gz"),
                  signature: $mac_arm64_sig
                },
                "darwin-x86_64": {
                  url: ($base + "/ClawX.app.tar.gz"),
                  signature: $mac_x64_sig
                },
                "windows-x86_64": {
                  url: ($base + "/ClawX_" + $version + "_x64-setup.nsis.zip"),
                  signature: $win_sig
                },
                "linux-x86_64": {
                  url: ($base + "/ClawX_" + $version + "_amd64.AppImage.tar.gz"),
                  signature: $linux_sig
                }
              }
            }' > staging/${CHANNEL}/tauri-update.json

          echo "=== tauri-update.json ==="
          cat staging/${CHANNEL}/tauri-update.json

      - name: Install and configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          curl -sL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          cat > $HOME/.ossutilconfig << EOF
          [Credentials]
          language=EN
          endpoint=oss-cn-hangzhou.aliyuncs.com
          accessKeyID=${OSS_ACCESS_KEY_ID}
          accessKeySecret=${OSS_ACCESS_KEY_SECRET}
          EOF
          ossutil --version

      - name: "Upload to OSS: {channel}/ (overwrite)"
        run: |
          CHANNEL="${{ steps.version.outputs.channel }}"
          ossutil rm -r -f oss://valuecell-clawx/${CHANNEL}/ || true
          ossutil cp -r -f \
            --meta="Cache-Control:no-cache,no-store,must-revalidate" \
            staging/${CHANNEL}/ \
            oss://valuecell-clawx/${CHANNEL}/
          echo "Uploaded to ${CHANNEL}/"

      - name: "Upload to OSS: releases/vX.Y.Z/ (archive)"
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ossutil cp -r \
            staging/releases/${TAG}/ \
            oss://valuecell-clawx/releases/${TAG}/ \
            --meta "Cache-Control:public,max-age=31536000,immutable"
          echo "Uploaded to releases/${TAG}/"

      - name: Verify OSS upload
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          CHANNEL="${{ steps.version.outputs.channel }}"

          echo "=== ${CHANNEL}/ ==="
          ossutil ls oss://valuecell-clawx/${CHANNEL}/ --short

          echo ""
          echo "=== Verify tauri-update.json ==="
          ossutil cp oss://valuecell-clawx/${CHANNEL}/tauri-update.json /tmp/tauri-update.json -f
          jq . /tmp/tauri-update.json

          echo ""
          echo "All files uploaded and verified successfully!"
